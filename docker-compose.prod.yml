services:
  redis:
    image: redis:7-alpine
    container_name: petposture-redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --bind 127.0.0.1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: petposture-backend:prod
    container_name: petposture-backend
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage/app/public:/app/storage/app/public
      - ./backend/storage/logs:/app/storage/logs

  background-removal:
    build:
      context: ./backend/background-removal
      dockerfile: Dockerfile
    image: petposture-background-removal:prod
    container_name: petposture-background-removal
    restart: unless-stopped
    network_mode: host
    environment:
      U2NET_HOME: /models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # `next build` prerenders `/` and `/blog` (and a few list pages) from the API. The public API
      # answers 403 to the VPS (Cloudflare), and the default build network cannot reach the backend
      # on the host, so those pages used to be baked EMPTY and stayed that way until ISR rebuilt them
      # (up to ~10 min with Cloudflare in front). Host networking lets the build read the backend that
      # is still running during the build, so the pages are baked with real data. The backend must
      # keep listening on 127.0.0.1:8001 (it does: network_mode host). If it is down at build time
      # the pages fall back to the old empty state; the build does not fail.
      network: host
      args:
        NEXT_PUBLIC_API_URL: https://api.petposture.com
        INTERNAL_API_URL: http://127.0.0.1:8001
    image: petposture-frontend:prod
    container_name: petposture-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3001"
      INTERNAL_API_URL: http://127.0.0.1:8001
    env_file:
      - ./frontend/.env

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.petposture.com
        VITE_FRONTEND_URL: https://petposture.com
    image: petposture-admin:prod
    container_name: petposture-admin
    restart: unless-stopped
    network_mode: host

volumes:
  redis_data:
